# Alacritty Config (https://alacritty.org/)
# https://alacritty.org/config-alacritty.html
[window]
#decorations = "None"
opacity = 1.0 #0.96
#padding = { x = 8, y = 8 }
padding = { x = 3, y = 3 }
dynamic_padding = true

[font]
size = 10

[font.bold]
family = "Source Code Pro"
style = "Bold"

[font.bold_italic]
family = "Source Code Pro"
style = "Bold Italic"

[font.italic]
family = "Source Code Pro"
style = "Italic"

[font.normal]
family = "Source Code Pro"
style = "Regular"

[general]
# Themes: https://github.com/alacritty/alacritty-theme
import = [
    "~/.config/alacritty/themes/themes/alabaster_dark.toml"
]

[colors.primary]
background="#000000"
foreground="#ffffff"

[colors.normal]
white = "#ffffff"
cyan = "#00B7EB"

[colors.bright]
white = "#ffffff"
cyan = "#00B7EB"

[colors.dim]
white = "#ffffff"
cyan = "#00B7EB"
